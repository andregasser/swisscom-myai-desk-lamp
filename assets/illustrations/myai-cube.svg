<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title description">
<title id="title">myAI Cube — selbst gedruckte Würfellampe</title>
<desc id="description">Illustration der weißen 150-mm-Würfellampe mit mittig angeordnetem myAI-Logo auf beiden sichtbaren Seiten und abnehmbarem Deckel. Lichtwirkung schematisch.</desc>
