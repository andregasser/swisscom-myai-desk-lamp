 <text x="96" y="200" font-size="16" font-weight="600" letter-spacing="3">3D-DRUCK · LICHT · DESIGN</text>
 <text x="90" y="298" font-size="82" font-weight="700" letter-spacing="-3">myAI Cube</text>
 <text x="96" y="366" font-size="30" fill="#627483">Ein kleines Lichtobjekt.</text>
 <text x="96" y="410" font-size="30" fill="#627483">Selbst gedruckt.</text>
 <rect x="96" y="465" width="248" height="50" rx="25" fill="#E5EDF1"/>
 <text x="220" y="497" font-size="19" text-anchor="middle">150 × 150 × 150 mm</text>
 <text x="96" y="594" font-size="20" font-weight="600">Weißes PLA. Vier Logo-Seiten.</text>
 <text x="96" y="630" font-size="19" fill="#627483">Für den Bambu Lab P1S und das LED Kit 001.</text>
 <text x="96" y="750" font-size="14" fill="#8A969E" letter-spacing="1">ENTWURF V2 · LICHTWIRKUNG SCHEMATISCH</text>
</g>
