<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160"><rect width="1500" height="1160" fill="#edf1f5"/><g font-family="DejaVu Sans,sans-serif" fill="#1d2940"><text x="42" y="54" font-size="32" font-weight="bold">CMY · Kleine Verlaufskarte</text><text x="42" y="91" font-size="23" font-weight="normal">P1S · 0,4-mm-Düse · ein AMS · 90 × 62 mm</text><rect x="42" y="112" width="1416" height="48" rx="10" fill="#fff0cc"/><text x="60" y="143" font-size="20" font-weight="bold">Schematische Farbillustration – keine Vorhersage des Drucks oder der LED-Wirkung.</text><g transform="translate(88 215) scale(9)"><rect width="90" height="62" rx="2" fill="white" stroke="#c8d1dc" stroke-width=".2"/><rect x="7.0" y="8" width="8" height="8" fill="#6dffff"/><rect x="15.5" y="8" width="8" height="8" fill="#2fffff"/><rect x="24.0" y="8" width="8" height="8" fill="#09ffff"/><rect x="32.5" y="8" width="8" height="8" fill="#ff6dff"/><rect x="41.0" y="8" width="8" height="8" fill="#ff2fff"/><rect x="49.5" y="8" width="8" height="8" fill="#ff09ff"/><rect x="58.0" y="8" width="8" height="8" fill="#ffff6d"/><rect x="66.5" y="8" width="8" height="8" fill="#ffff2f"/><rect x="75.0" y="8" width="8" height="8" fill="#ffff09"/><rect x="7.0" y="25" width="8" height="10" fill="#ff6d14"/><rect x="15.5" y="25" width="8" height="10" fill="#ff6d2f"/><rect x="24.0" y="25" width="8" height="10" fill="#ff6d6d"/><rect x="32.5" y="25" width="8" height="10" fill="#ff6dff"/><rect x="41.0" y="25" width="8" height="10" fill="#6d6dff"/><rect x="49.5" y="25" width="8" height="10" fill="#2f6dff"/><rect x="58.0" y="25" width="8" height="10" fill="#146dff"/><rect x="66.5" y="25" width="8" height="10" fill="#096dff"/><rect x="75.0" y="25" width="8" height="10" fill="#09ffff"/><rect x="7.0" y="43" width="8" height="10" fill="#ff2f14"/><rect x="15.5" y="43" width="8" height="10" fill="#ff2f2f"/><rect x="24.0" y="43" width="8" height="10" fill="#ff2f6d"/><rect x="32.5" y="43" width="8" height="10" fill="#ff2fff"/><rect x="41.0" y="43" width="8" height="10" fill="#6d2fff"/><rect x="49.5" y="43" width="8" height="10" fill="#2f2fff"/><rect x="58.0" y="43" width="8" height="10" fill="#142fff"/><rect x="66.5" y="43" width="8" height="10" fill="#092fff"/><rect x="75.0" y="43" width="8" height="10" fill="#09ffff"/></g><text x="88" y="197" font-size="18" font-weight="normal">Durchsicht von der ebenen weissen Seite · Farben liegen dahinter</text><text x="187.0" y="382.4" text-anchor="middle" font-size="14">A1</text><text x="263.5" y="382.4" text-anchor="middle" font-size="14">A2</text><text x="340.0" y="382.4" text-anchor="middle" font-size="14">A3</text><text x="416.5" y="382.4" text-anchor="middle" font-size="14">A4</text><text x="493.0" y="382.4" text-anchor="middle" font-size="14">A5</text><text x="569.5" y="382.4" text-anchor="middle" font-size="14">A6</text><text x="646.0" y="382.4" text-anchor="middle" font-size="14">A7</text><text x="722.5" y="382.4" text-anchor="middle" font-size="14">A8</text><text x="799.0" y="382.4" text-anchor="middle" font-size="14">A9</text><text x="187.0" y="553.4000000000001" text-anchor="middle" font-size="14">B1</text><text x="263.5" y="553.4000000000001" text-anchor="middle" font-size="14">B2</text><text x="340.0" y="553.4000000000001" text-anchor="middle" font-size="14">B3</text><text x="416.5" y="553.4000000000001" text-anchor="middle" font-size="14">B4</text><text x="493.0" y="553.4000000000001" text-anchor="middle" font-size="14">B5</text><text x="569.5" y="553.4000000000001" text-anchor="middle" font-size="14">B6</text><text x="646.0" y="553.4000000000001" text-anchor="middle" font-size="14">B7</text><text x="722.5" y="553.4000000000001" text-anchor="middle" font-size="14">B8</text><text x="799.0" y="553.4000000000001" text-anchor="middle" font-size="14">B9</text><text x="187.0" y="715.4000000000001" text-anchor="middle" font-size="14">C1</text><text x="263.5" y="715.4000000000001" text-anchor="middle" font-size="14">C2</text><text x="340.0" y="715.4000000000001" text-anchor="middle" font-size="14">C3</text><text x="416.5" y="715.4000000000001" text-anchor="middle" font-size="14">C4</text><text x="493.0" y="715.4000000000001" text-anchor="middle" font-size="14">C5</text><text x="569.5" y="715.4000000000001" text-anchor="middle" font-size="14">C6</text><text x="646.0" y="715.4000000000001" text-anchor="middle" font-size="14">C7</text><text x="722.5" y="715.4000000000001" text-anchor="middle" font-size="14">C8</text><text x="799.0" y="715.4000000000001" text-anchor="middle" font-size="14">C9</text><text x="50" y="331" font-size="24" font-weight="bold">A</text><text x="50" y="493" font-size="24" font-weight="bold">B</text><text x="50" y="655" font-size="24" font-weight="bold">C</text><text x="88" y="807" font-size="18" font-weight="normal">27 breite Prüffelder · weisse Zwischenräume bewusst vorgesehen</text><text x="88" y="836" font-size="17" font-weight="normal">Feldnummern nur als Bildlegende; sie werden nicht mitgedruckt.</text><text x="952" y="221" font-size="23" font-weight="bold">A · Einzelne Farben</text><text x="952" y="254" font-size="19" font-weight="normal">Cyan / Magenta / Gelb</text><text x="952" y="284" font-size="19" font-weight="normal">Je 0,10 / 0,20 / 0,40 mm Farbe</text><text x="952" y="314" font-size="18" font-weight="normal">Vergleich: Sättigung und Lichtverlust</text><text x="952" y="370" font-size="23" font-weight="bold">B · Weniger Magenta</text><text x="952" y="403" font-size="19" font-weight="normal">0,10 mm Magenta + variable C/Y</text><text x="952" y="433" font-size="18" font-weight="normal">Rotbereich → Violett/Blau → Cyan</text><text x="952" y="489" font-size="23" font-weight="bold">C · Mehr Magenta</text><text x="952" y="522" font-size="19" font-weight="normal">0,20 mm Magenta + gleiche C/Y</text><text x="952" y="552" font-size="18" font-weight="normal">Vergleich: Rot und Blau gegenüber B</text><text x="952" y="589" font-size="17" font-weight="normal">B9 / C9: identische Cyan-Kontrolle</text><text x="952" y="645" font-size="21" font-weight="bold">Schichten statt schmaler Farbstreifen</text><text x="952" y="677" font-size="16" font-weight="normal">Beispiel C6 · Querschnitt, stark vergrössert</text><rect x="960" y="700.0" width="200" height="28.00000000000001" fill="#0086D6" stroke="#526071" stroke-width="1"/><text x="1175" y="720.0" font-size="17" font-weight="normal">0,20 mm Cyan</text><rect x="960" y="728.0" width="200" height="27.999999999999993" fill="#EC008C" stroke="#526071" stroke-width="1"/><text x="1175" y="748.0" font-size="17" font-weight="normal">0,20 mm Magenta</text><rect x="960" y="756.0" width="200" height="56.0" fill="#FFFFFF" stroke="#526071" stroke-width="1"/><text x="1175" y="790.0" font-size="17" font-weight="normal">0,40 mm Weiss</text><text x="960" y="840" font-size="17" font-weight="normal">LED oben · Blick von unten</text><rect x="42" y="882" width="1416" height="214" rx="14" fill="white"/><text x="64" y="919" font-size="24" font-weight="bold">Was wir damit herausfinden</text><text x="64" y="956" font-size="19" font-weight="normal">Welche Schichtmischungen mit deinem LED-Kit gute Rot-, Violett- und Blautöne ergeben – und wie hell sie bleiben.</text><text x="64" y="990" font-size="19" font-weight="normal">Geplant: 0,40 mm Weiss + 0,10-mm-Farblagen; bis 1,00 mm Gesamtdicke. Rückseite gestuft, Vorderseite eben.</text><text x="64" y="1024" font-size="19" font-weight="normal">Zuerst Materialabgleich in breiten Feldern. Ein feiner Logo-Verlauf folgt erst aus den beobachteten Farben.</text><text x="64" y="1060" font-size="18" font-weight="bold">Nur Vorschau und Schichtrezepte · noch keine Druckdatei, Slicer-Prüfung oder bestätigte Farbmischung.</text></g></svg>